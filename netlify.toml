# Netlify: Web-App aus public/, Server-Funktionen aus netlify/functions/.
# Diese Datei hat Vorrang vor den Einstellungen in der Netlify-Oberfläche.
[build]
  publish = "public"
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Service Worker, Konfiguration und App-Seite nie zwischenspeichern, damit Updates sofort ankommen.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
