<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meine To-dos</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1d2330; --muted: #6b7280;
    --border: #e3e6eb; --accent: #3b6cf6; --accent-text: #ffffff; --danger: #d93a3a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161b; --card: #1e2128; --text: #e8eaf0; --muted: #9aa1ad;
      --border: #2e323b; --accent: #6b8fff; --accent-text: #0e1220; --danger: #ff6b6b;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161b; --card: #1e2128; --text: #e8eaf0; --muted: #9aa1ad;
    --border: #2e323b; --accent: #6b8fff; --accent-text: #0e1220; --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 40px 16px; }
  h1 { font-size: 1.75rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type="text"] {
    flex: 1; min-width: 0; padding: 12px 14px; font: inherit; color: inherit;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  }
  input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { font: inherit; cursor: pointer; border-radius: 10px; }
  .add { padding: 0 18px; background: var(--accent); color: var(--accent-text); border: 0; font-weight: 600; }
  .filters { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .filters button {
    padding: 6px 12px; background: transparent; color: var(--muted);
    border: 1px solid var(--border); font-size: .9rem;
  }
  .filters button[aria-pressed="true"] { color: var(--text); border-color: var(--accent); }
  ul { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--border); }
  li:first-child { border-top: 0; }
  li input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
  li .text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  li.done .text { text-decoration: line-through; color: var(--muted); }
  li .del { background: transparent; border: 0; color: var(--muted); font-size: 1.25rem; line-height: 1; padding: 4px 8px; }
  li .del:hover { color: var(--danger); }
  .edit { flex: 1; padding: 4px 8px; }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
  footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; color: var(--muted); font-size: .9rem; }
  footer button { background: transparent; border: 0; color: var(--muted); padding: 4px 0; }
  footer button:hover { color: var(--danger); }
</style>
</head>
<body>
<main>
  <h1>Meine To-dos</h1>
  <p class="sub">Doppelklick auf eine Aufgabe zum Bearbeiten.</p>

  <form id="form">
    <input id="input" type="text" placeholder="Was ist zu tun?" autocomplete="off" aria-label="Neue Aufgabe">
    <button class="add" type="submit">Hinzufügen</button>
  </form>

  <div class="filters" role="group" aria-label="Filter">
    <button data-filter="all" aria-pressed="true">Alle</button>
    <button data-filter="open" aria-pressed="false">Offen</button>
    <button data-filter="done" aria-pressed="false">Erledigt</button>
  </div>

  <ul id="list"></ul>

  <footer>
    <span id="count"></span>
    <button id="clear" type="button">Erledigte löschen</button>
  </footer>
</main>

<script>
  const KEY = "todos-v1";
  let todos = load();
  let filter = "all";

  const $ = (s) => document.querySelector(s);
  const list = $("#list"), input = $("#input");

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch {}
  }

  function render() {
    const shown = todos.filter((t) => filter === "all" || (filter === "done") === t.done);
    list.replaceChildren();
    if (!shown.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = todos.length ? "Nichts in dieser Ansicht." : "Noch keine Aufgaben – leg los!";
      list.append(li);
    }
    for (const t of shown) {
      const li = document.createElement("li");
      li.classList.toggle("done", t.done);

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = t.done;
      cb.setAttribute("aria-label", "Erledigt");
      cb.addEventListener("change", () => { t.done = cb.checked; update(); });

      const span = document.createElement("span");
      span.className = "text";
      span.textContent = t.text;
      span.addEventListener("dblclick", () => startEdit(li, span, t));

      const del = document.createElement("button");
      del.className = "del";
      del.textContent = "×";
      del.setAttribute("aria-label", "Löschen");
      del.addEventListener("click", () => { todos = todos.filter((x) => x !== t); update(); });

      li.append(cb, span, del);
      list.append(li);
    }
    const open = todos.filter((t) => !t.done).length;
    $("#count").textContent = `${open} offen · ${todos.length - open} erledigt`;
    $("#clear").hidden = !todos.some((t) => t.done);
  }

  function startEdit(li, span, t) {
    const field = document.createElement("input");
    field.type = "text";
    field.className = "edit";
    field.value = t.text;
    span.replaceWith(field);
    field.focus();
    let finished = false;
    const finish = (commit) => {
      if (finished) return;
      finished = true;
      const v = field.value.trim();
      if (commit) {
        if (v) t.text = v;
        else todos = todos.filter((x) => x !== t);
      }
      update();
    };
    field.addEventListener("keydown", (e) => {
      if (e.key === "Enter") finish(true);
      if (e.key === "Escape") finish(false);
    });
    field.addEventListener("blur", () => finish(true));
  }

  function update() { save(); render(); }

  $("#form").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    todos.push({ id: Date.now(), text, done: false });
    input.value = "";
    update();
  });

  document.querySelectorAll(".filters button").forEach((b) =>
    b.addEventListener("click", () => {
      filter = b.dataset.filter;
      document.querySelectorAll(".filters button").forEach((x) =>
        x.setAttribute("aria-pressed", String(x === b)));
      render();
    }));

  $("#clear").addEventListener("click", () => { todos = todos.filter((t) => !t.done); update(); });

  render();
  input.focus();
</script>
</body>
</html>
