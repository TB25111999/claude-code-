<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>GymLog</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Layout: einspaltige Handy-App, feste Tab-Leiste unten, Karten nur für Übungen und Auswertungen */
:root {
  --bg: #f5f4f2; --card: #ffffff; --text: #1b1a18; --muted: #6e6a64;
  --line: #e4e1dc; --chip: #efece7; --accent: #d9480f; --accent-text: #ffffff;
  --ok: #2f9e44; --danger: #c92a2a; --danger-text: #ffffff;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121110; --card: #1c1a18; --text: #efece8; --muted: #a39d95;
    --line: #2e2b28; --chip: #262320; --accent: #ff8a3d; --accent-text: #1b1a18;
    --ok: #40c057; --danger: #ff6b6b; --danger-text: #1b1a18; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121110; --card: #1c1a18; --text: #efece8; --muted: #a39d95;
  --line: #2e2b28; --chip: #262320; --accent: #ff8a3d; --accent-text: #1b1a18;
  --ok: #40c057; --danger: #ff6b6b; --danger-text: #1b1a18; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 16px/1.45 var(--font-body);
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  padding-block: 14px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--line);
}
header h1 { font: 700 26px/1 var(--font-display); letter-spacing: .02em; text-transform: uppercase; margin: 0; }
h1, h2, h3 { text-wrap: balance; }
main { max-width: 720px; margin: 0 auto; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--card); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
nav button {
  background: none; border: 0; color: var(--muted); padding: 10px 0 8px;
  font: 500 12px var(--font-body); display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer;
}
nav button svg { width: 22px; height: 22px; }
nav button.active { color: var(--accent); font-weight: 600; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
.row { display: flex; gap: 8px; align-items: center; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.muted { color: var(--muted); font-size: 14px; }
h2 { font: 700 21px/1.1 var(--font-display); text-transform: uppercase; letter-spacing: .03em; margin: 4px 0 12px; }
h3 { font-size: 16px; font-weight: 600; margin: 0; }
button.btn, .btn {
  border: 1px solid var(--line); background: var(--chip); color: var(--text);
  border-radius: 10px; padding: 10px 14px; font-size: 15px; cursor: pointer; font-weight: 500;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn.danger { color: var(--danger); }
.btn.danger-fill { background: var(--danger); border-color: var(--danger); color: var(--danger-text); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.small { padding: 6px 10px; font-size: 14px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; }
input, select {
  font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
  border-radius: 10px; padding: 9px 10px; width: 100%; min-width: 0;
}
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.stat .v { font: 700 30px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.stat .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
table.sets { width: 100%; border-collapse: collapse; margin-top: 8px; }
table.sets th { font-size: 12px; color: var(--muted); font-weight: 500; text-align: left; padding: 4px; }
table.sets td { padding: 4px; vertical-align: middle; }
table.sets td.n { width: 28px; color: var(--muted); font-size: 14px; }
table.sets td.prev { width: 74px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
table.sets td.prev button { background: none; border: 0; padding: 6px 0; color: inherit; font: inherit; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
table.sets input::placeholder { color: var(--muted); opacity: .7; }
.last { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; padding: 8px 10px; border-radius: 10px; background: var(--chip); font-size: 14px; }
.last span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.last strong { font-weight: 600; font-variant-numeric: tabular-nums; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stepper button { background: var(--chip); border: 0; color: var(--text); width: 32px; height: 32px; font-size: 16px; cursor: pointer; }
.stepper span { padding: 0 8px; font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
table.sets input { padding: 8px 6px; text-align: center; font-variant-numeric: tabular-nums; }
table.sets tr.done input { border-color: var(--ok); }
.check {
  width: 40px; height: 38px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--chip); color: var(--muted); font-size: 18px; cursor: pointer;
}
tr.done .check { background: var(--ok); border-color: var(--ok); color: #fff; }
.chip { display: inline-block; background: var(--chip); border-radius: 999px; padding: 3px 10px; font-size: 13px; color: var(--muted); }
.list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); gap: 8px; }
.list-item:last-child { border-bottom: 0; }
.timer {
  position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 9;
  max-width: 688px; margin: 0 auto; background: var(--accent); color: var(--accent-text);
  border-radius: 14px; padding: 10px 14px; display: none; align-items: center; justify-content: space-between; gap: 8px;
  box-shadow: 0 6px 20px rgba(0,0,0,.25);
}
.timer.show { display: flex; }
body.timing { padding-bottom: calc(150px + env(safe-area-inset-bottom)); }
.timer .t { font: 700 30px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.timer button { background: rgba(0,0,0,.14); color: inherit; border: 0; border-radius: 8px; padding: 6px 10px; font-size: 14px; cursor: pointer; }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 20; display: none; align-items: flex-end; justify-content: center; }
.modal-bg.show { display: flex; }
.modal { background: var(--card); width: 100%; max-width: 720px; max-height: 85vh; overflow: auto; border-radius: 18px 18px 0 0; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#askBg { z-index: 25; align-items: center; padding: 16px; }
#askBg .modal { border-radius: 16px; max-width: 420px; padding: 16px; }
.sync { display: inline-flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync.cloud::before { background: var(--ok); }
.pr { color: var(--ok); font-weight: 600; font-size: 13px; }
canvas { width: 100%; height: 200px; display: block; }
.empty { text-align: center; color: var(--muted); padding: 24px 8px; }
.heat { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.heat div { aspect-ratio: 1; border-radius: 4px; background: var(--chip); }
.heat div.on { background: var(--accent); }
.heat div.today { outline: 2px solid var(--muted); }
details summary { cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1 id="title">GymLog</h1>
  <button class="btn small" id="themeBtn" title="Hell/Dunkel wechseln" aria-label="Hell/Dunkel wechseln"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
</header>
<main id="view"></main>

<div class="timer" id="timer">
  <div><div style="opacity:.8;font-size:12px;text-transform:uppercase;letter-spacing:.06em">Pause</div><div class="t" id="timerT">0:00</div></div>
  <div class="row">
    <button data-tadd="-15">−15</button>
    <button data-tadd="15">+15</button>
    <button id="timerStop">✕</button>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="modal-bg" id="askBg"><div class="modal" id="ask" role="alertdialog"></div></div>

<nav id="nav">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Start</button>
  <button data-tab="workout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7v10M18 7v10M3 9.5v5M21 9.5v5M6 12h12"/></svg>Training</button>
  <button data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Verlauf</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19h16"/><path d="M5 15l4-4 4 3 6-7"/></svg>Fortschritt</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/></svg>Mehr</button>
</nav>

<script>
"use strict";

// ---------- Daten ----------
const KEY = "gymlog.v1";
const DEFAULT_EXERCISES = [
  ["Bankdrücken", "Brust"], ["Schrägbankdrücken (KH)", "Brust"], ["Butterfly (Maschine)", "Brust"], ["Dips", "Brust"],
  ["Kreuzheben", "Rücken"], ["Klimmzüge", "Rücken"], ["Latzug", "Rücken"], ["Rudern (Langhantel)", "Rücken"], ["Kabelrudern", "Rücken"],
  ["Kniebeugen", "Beine"], ["Beinpresse", "Beine"], ["Rumänisches Kreuzheben", "Beine"], ["Beinstrecker", "Beine"], ["Beinbeuger", "Beine"], ["Wadenheben", "Beine"], ["Ausfallschritte", "Beine"],
  ["Schulterdrücken", "Schultern"], ["Seitheben", "Schultern"], ["Face Pulls", "Schultern"],
  ["Bizepscurls (KH)", "Arme"], ["Hammercurls", "Arme"], ["Trizepsdrücken (Kabel)", "Arme"], ["French Press", "Arme"],
  ["Plank", "Core"], ["Crunches", "Core"], ["Beinheben hängend", "Core"],
];
const GROUPS = ["Brust", "Rücken", "Beine", "Schultern", "Arme", "Core", "Sonstiges"];

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

function freshState() {
  const exercises = DEFAULT_EXERCISES.map(([name, group]) => ({ id: uid(), name, group }));
  const byName = n => exercises.find(e => e.name === n).id;
  return {
    exercises,
    templates: [
      { id: uid(), name: "Push", exerciseIds: ["Bankdrücken", "Schulterdrücken", "Schrägbankdrücken (KH)", "Seitheben", "Trizepsdrücken (Kabel)"].map(byName) },
      { id: uid(), name: "Pull", exerciseIds: ["Kreuzheben", "Klimmzüge", "Rudern (Langhantel)", "Face Pulls", "Bizepscurls (KH)"].map(byName) },
      { id: uid(), name: "Beine", exerciseIds: ["Kniebeugen", "Rumänisches Kreuzheben", "Beinpresse", "Beinbeuger", "Wadenheben"].map(byName) },
    ],
    workouts: [],      // {id, name, start, end, entries:[{exerciseId, sets:[{w, r, done}]}]}
    active: null,      // laufendes Training
    bodyweight: [],    // {date, kg}
    settings: { rest: 90, theme: "auto", weeklyGoal: 3 },
  };
}

// Speicherung: im claude.ai-Viewer privat im Konto (db), sonst im Browser (localStorage)
const META = ["exercises", "templates", "active", "bodyweight", "settings"];
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || freshState(); } catch { S = freshState(); }
S.settings = Object.assign({ rest: 90, theme: "auto", weeklyGoal: 3 }, S.settings);
let db = null, userId = null, cloud = false, readOnly = false, metaTimer = null, writes = Promise.resolve();
const metaRef = () => db.doc(`data/users/${userId}/gymlog`);
const workoutRef = id => metaRef().collection("workouts").doc(id);
function queueWrite(fn) { writes = writes.then(fn).catch(syncError); return writes; }
function syncError(e) {
  if (e && e.code === "invalid_argument") { readOnly = true; toast("Du kannst hier nur lesen. Änderungen werden nicht gespeichert."); }
  else if (e && e.code === "quota_exceeded") toast("Speicher voll. Lösche alte Trainings, um neue zu speichern.");
  else toast("Speichern fehlgeschlagen. Prüfe deine Verbindung.");
}
function save() {
  if (!cloud) { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} return; }
  if (readOnly) return;
  clearTimeout(metaTimer);
  metaTimer = setTimeout(() => {
    const body = {}; META.forEach(k => body[k] = S[k] ?? null);
    queueWrite(() => metaRef().set(body));
  }, 500);
}
function saveWorkout(w) { save(); if (cloud && !readOnly) queueWrite(() => workoutRef(w.id).set(w)); }
function dropWorkout(id) { save(); if (cloud && !readOnly) queueWrite(() => workoutRef(id).delete()); }
async function replaceAll(next) {
  const old = S.workouts.map(w => w.id);
  S = next; save();
  if (!cloud || readOnly) return;
  for (const id of old) if (!S.workouts.some(w => w.id === id)) await queueWrite(() => workoutRef(id).delete());
  for (const w of S.workouts) await queueWrite(() => workoutRef(w.id).set(w));
}
async function initCloud() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [d, u] = await Promise.all([claude.use("db"), claude.use("user")]);
    const id = u ? await u.id() : null;
    if (!d || !id) return;
    db = d; userId = id;
    const [m, ws] = await Promise.all([metaRef().get(), metaRef().collection("workouts").orderBy("start").limit(1000).get()]);
    const clone = o => JSON.parse(JSON.stringify(o));
    const next = freshState();
    if (m.exists) { const data = clone(m.data()); META.forEach(k => { if (k in data) next[k] = data[k]; }); }
    next.settings = Object.assign(freshState().settings, next.settings);
    next.workouts = ws.docs.map(x => clone(x.data()));
    S = next; cloud = true;
    if (S.active && tab === "home") tab = "workout";
    applyTheme(); render();
  } catch (e) { cloud = false; }
}

// ---------- Helfer ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const exName = id => (S.exercises.find(e => e.id === id) || { name: "Gelöschte Übung" }).name;
const fmtDate = t => new Date(t).toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", year: "2-digit" });
const fmtNum = n => (Math.round(n * 10) / 10).toLocaleString("de-DE");
const fmtDur = ms => { const m = Math.round(ms / 60000); return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`; };
const e1rm = (w, r) => r > 0 && w > 0 ? (r === 1 ? w : w * (1 + r / 30)) : 0; // Epley
const doneSets = entry => entry.sets.filter(s => s.done && s.r > 0);
const volume = w => w.entries.reduce((a, e) => a + doneSets(e).reduce((b, s) => b + (s.w || 0) * s.r, 0), 0);
const setCount = w => w.entries.reduce((a, e) => a + doneSets(e).length, 0);
const dayKey = t => { const d = new Date(t); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; };
function startOfWeek(t) { const d = new Date(t); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getTime(); }

function lastEntryFor(exerciseId, excludeId) {
  for (let i = S.workouts.length - 1; i >= 0; i--) {
    const w = S.workouts[i];
    if (w.id === excludeId) continue;
    const e = w.entries.find(x => x.exerciseId === exerciseId);
    if (e && doneSets(e).length) return { sets: doneSets(e), start: w.start };
  }
  return null;
}
const lastSetsFor = (exerciseId, excludeId) => (lastEntryFor(exerciseId, excludeId) || {}).sets || null;
const prevSet = (prev, j) => prev ? prev[Math.min(j, prev.length - 1)] : null;
const fmtSet = s => `${fmtNum(s.w || 0)} × ${s.r}`;
const planSets = (t, id) => (t.sets && t.sets[id]) || 3;
function bestE1rm(exerciseId, beforeTime = Infinity) {
  let best = 0;
  for (const w of S.workouts) {
    if (w.start >= beforeTime) continue;
    for (const e of w.entries) if (e.exerciseId === exerciseId) for (const s of doneSets(e)) best = Math.max(best, e1rm(s.w, s.r));
  }
  return best;
}

function applyTheme() {
  const t = S.settings.theme;
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
}

// ---------- Navigation ----------
let tab = S.active ? "workout" : "home";
let progressEx = null;
function go(t) { tab = t; render(); window.scrollTo(0, 0); }
$("#nav").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) go(b.dataset.tab); });
$("#themeBtn").onclick = () => {
  const order = ["auto", "light", "dark"];
  S.settings.theme = order[(order.indexOf(S.settings.theme) + 1) % 3];
  save(); applyTheme(); toast(`Design: ${{ auto: "System", light: "Hell", dark: "Dunkel" }[S.settings.theme]}`);
};

function render() {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  const titles = { home: "GymLog", workout: S.active ? S.active.name : "Training", history: "Verlauf", progress: "Fortschritt", settings: "Mehr" };
  $("#title").textContent = titles[tab];
  $("#view").innerHTML = ({ home: viewHome, workout: viewWorkout, history: viewHistory, progress: viewProgress, settings: viewSettings })[tab]();
  if (tab === "progress") drawCharts();
}

// ---------- Start ----------
function viewHome() {
  const now = Date.now(), wk = startOfWeek(now);
  const thisWeek = S.workouts.filter(w => w.start >= wk);
  const goal = S.settings.weeklyGoal;
  // Serie: aufeinanderfolgende Wochen mit erreichtem Ziel
  let streak = 0;
  for (let ws = wk - 7 * 864e5; ; ws -= 7 * 864e5) {
    const n = S.workouts.filter(w => w.start >= ws && w.start < ws + 7 * 864e5).length;
    if (n >= goal) streak++; else break;
  }
  if (thisWeek.length >= goal) streak++;

  // Kalender: letzte 5 Wochen
  const days = new Set(S.workouts.map(w => dayKey(w.start)));
  const first = wk - 28 * 864e5; let heat = "";
  for (let i = 0; i < 35; i++) {
    const t = first + i * 864e5;
    heat += `<div class="${days.has(dayKey(t)) ? "on" : ""} ${dayKey(t) === dayKey(now) ? "today" : ""}" title="${fmtDate(t)}"></div>`;
  }

  const last = S.workouts[S.workouts.length - 1];
  return `
  ${S.active ? `<div class="card row between"><div><h3>Training läuft</h3><div class="muted">${esc(S.active.name)} · seit ${fmtDur(now - S.active.start)}</div></div><button class="btn primary" onclick="go('workout')">Weiter</button></div>` : ""}
  <div class="stats">
    <div class="stat"><div class="v">${thisWeek.length}/${goal}</div><div class="l">Diese Woche</div></div>
    <div class="stat"><div class="v">${streak}</div><div class="l">Wochen-Serie</div></div>
    <div class="stat"><div class="v">${S.workouts.length}</div><div class="l">Trainings gesamt</div></div>
  </div>
  <div class="card">
    <div class="row between" style="margin-bottom:8px"><h3>Letzte 5 Wochen</h3><span class="muted">Mo – So</span></div>
    <div class="heat">${heat}</div>
  </div>
  <div class="card">
    <h2>Training starten</h2>
    ${S.templates.map(t => `
      <div class="list-item">
        <div><strong>${esc(t.name)}</strong><div class="muted">${t.exerciseIds.map(exName).map(esc).join(", ") || "Keine Übungen"}</div></div>
        <button class="btn primary small" onclick="startWorkout('${t.id}')" ${S.active ? "disabled" : ""}>Start</button>
      </div>`).join("")}
    <div class="row" style="margin-top:10px">
      <button class="btn block" onclick="startWorkout(null)" ${S.active ? "disabled" : ""}>Leeres Training</button>
      <button class="btn block" onclick="editTemplate(null)">+ Plan</button>
    </div>
  </div>
  ${last ? `<div class="card"><h3>Letztes Training</h3><div class="muted">${esc(last.name)} · ${fmtDate(last.start)} · ${setCount(last)} Sätze · ${fmtNum(volume(last))} kg Volumen</div></div>` : ""}
  `;
}

function startWorkout(templateId) {
  if (S.active) return go("workout");
  const t = S.templates.find(x => x.id === templateId);
  S.active = {
    id: uid(), name: t ? t.name : "Training", start: Date.now(),
    entries: (t ? t.exerciseIds : []).map(id => newEntry(id, planSets(t, id))),
  };
  save(); go("workout");
}
// Neue Sätze bleiben leer; die Werte vom letzten Mal stehen als Platzhalter darin
function newEntry(exerciseId, count) {
  const prev = lastSetsFor(exerciseId);
  const n = count || (prev ? prev.length : 3);
  return { exerciseId, sets: Array.from({ length: n }, () => ({ w: "", r: "", done: false })) };
}

// ---------- Training ----------
function viewWorkout() {
  const a = S.active;
  if (!a) return `<div class="card empty"><p>Kein Training aktiv.</p><button class="btn primary" onclick="go('home')">Training auswählen</button></div>`;
  return `
  <div class="card row between">
    <div><div class="muted">Dauer</div><strong id="dur">${fmtDur(Date.now() - a.start)}</strong></div>
    <div><div class="muted">Sätze</div><strong>${setCount(a)}</strong></div>
    <div><div class="muted">Volumen</div><strong>${fmtNum(volume(a))} kg</strong></div>
  </div>
  ${a.entries.map((e, i) => {
    const last = lastEntryFor(e.exerciseId, a.id), prev = last && last.sets;
    const best = bestE1rm(e.exerciseId);
    return `
    <div class="card">
      <div class="row between">
        <h3>${esc(exName(e.exerciseId))}</h3>
        <div class="row">
          <button class="btn small" onclick="moveEntry(${i},-1)" ${i === 0 ? "disabled" : ""} aria-label="nach oben">↑</button>
          <button class="btn small danger" onclick="removeEntry(${i})" aria-label="entfernen">✕</button>
        </div>
      </div>
      ${last ? `<div class="last"><span>Letztes Training · ${fmtDate(last.start)}</span><strong>${prev.map(fmtSet).join(" · ")}</strong></div>` : `<div class="muted">Erstes Mal bei dieser Übung</div>`}
      <table class="sets">
        <tr><th>#</th><th>Vorher</th><th>kg</th><th>Wdh.</th><th></th><th></th></tr>
        ${e.sets.map((s, j) => {
          const isPr = s.done && best > 0 && e1rm(s.w, s.r) > best;
          const p = prevSet(prev, j);
          return `
          <tr class="${s.done ? "done" : ""}">
            <td class="n">${j + 1}</td>
            <td class="prev">${p ? `<button onclick="copyPrev(${i},${j})" title="Werte übernehmen">${fmtSet(p)}</button>` : "–"}</td>
            <td><input inputmode="decimal" value="${s.w}" placeholder="${p ? fmtNum(p.w || 0) : "0"}" onchange="setVal(${i},${j},'w',this.value)"></td>
            <td><input inputmode="numeric" value="${s.r}" placeholder="${p ? p.r : "0"}" onchange="setVal(${i},${j},'r',this.value)"></td>
            <td style="width:44px"><button class="check" onclick="toggleSet(${i},${j})" aria-label="Satz erledigt">✓</button></td>
            <td style="width:36px">${isPr ? `<span class="pr">PR</span>` : `<button class="btn small" style="padding:6px 8px" onclick="removeSet(${i},${j})" aria-label="Satz löschen">−</button>`}</td>
          </tr>`;
        }).join("")}
      </table>
      <button class="btn small" style="margin-top:8px" onclick="addSet(${i})">+ Satz</button>
    </div>`;
  }).join("")}
  <button class="btn block" onclick="pickExercise()">+ Übung hinzufügen</button>
  <div class="row" style="margin-top:12px">
    <button class="btn block danger" onclick="discardWorkout()">Verwerfen</button>
    <button class="btn block primary" onclick="finishWorkout()">Beenden & speichern</button>
  </div>`;
}

function setVal(i, j, k, v) {
  const n = parseFloat(String(v).replace(",", "."));
  S.active.entries[i].sets[j][k] = isNaN(n) ? "" : (k === "r" ? Math.round(n) : n);
  save();
}
function copyPrev(i, j) {
  const e = S.active.entries[i], p = prevSet(lastSetsFor(e.exerciseId, S.active.id), j);
  if (p) { e.sets[j].w = p.w; e.sets[j].r = p.r; save(); render(); }
}
function toggleSet(i, j) {
  const e = S.active.entries[i], s = e.sets[j];
  if (!s.done) {
    // Leere Felder übernehmen den Platzhalter vom letzten Training
    const p = prevSet(lastSetsFor(e.exerciseId, S.active.id), j);
    if (p && s.w === "") s.w = p.w;
    if (p && s.r === "") s.r = p.r;
  }
  if (!s.done && !(s.r > 0)) return toast("Bitte Wiederholungen eintragen");
  s.done = !s.done;
  save(); render();
  if (s.done) startTimer(S.settings.rest);
}
function addSet(i) {
  const sets = S.active.entries[i].sets, l = sets[sets.length - 1];
  sets.push({ w: l ? l.w : "", r: l ? l.r : "", done: false });
  save(); render();
}
function removeSet(i, j) { S.active.entries[i].sets.splice(j, 1); save(); render(); }
async function removeEntry(i) { if (await ask(`${exName(S.active.entries[i].exerciseId)} aus diesem Training entfernen?`, "Entfernen")) { S.active.entries.splice(i, 1); save(); render(); } }
function moveEntry(i, d) { const e = S.active.entries; [e[i], e[i + d]] = [e[i + d], e[i]]; save(); render(); }
async function discardWorkout() { if (await ask("Training verwerfen? Alle Sätze dieses Trainings gehen verloren.", "Verwerfen")) { S.active = null; stopTimer(); save(); go("home"); } }
async function finishWorkout() {
  const a = S.active;
  const pending = a.entries.reduce((n, e) => n + e.sets.filter(s => !s.done).length, 0);
  if (pending && setCount(a) && !(await ask(`${pending} Sätze sind nicht abgehakt und werden nicht gespeichert. Trotzdem beenden?`, "Beenden"))) return;
  a.entries.forEach(e => e.sets = e.sets.filter(s => s.done));
  a.entries = a.entries.filter(e => e.sets.length);
  if (!a.entries.length) { if (!(await ask("Du hast keinen Satz abgehakt. Training ohne Speichern beenden?", "Beenden"))) return; S.active = null; save(); return go("home"); }
  a.end = Date.now();
  const prs = a.entries.filter(e => { const b = bestE1rm(e.exerciseId, a.start); return b > 0 && Math.max(...e.sets.map(s => e1rm(s.w, s.r))) > b; }).length;
  S.workouts.push(a); S.active = null; stopTimer(); saveWorkout(a);
  toast(`Gespeichert! ${setCount(a)} Sätze, ${fmtNum(volume(a))} kg${prs ? ` · ${prs} neue PRs 🎉` : ""}`);
  go("home");
}

// ---------- Fortschritt ----------
function viewProgress() {
  const used = [...new Set(S.workouts.flatMap(w => w.entries.map(e => e.exerciseId)))];
  if (!progressEx || !used.includes(progressEx)) progressEx = used[0] || null;
  const bw = [...S.bodyweight].sort((a, b) => a.date - b.date);

  let exPart = `<div class="card empty">Schließe ein Training ab, um Fortschritt zu sehen.</div>`;
  if (progressEx) {
    const pts = exercisePoints(progressEx);
    const best = Math.max(...pts.map(p => p.y));
    const maxW = Math.max(...S.workouts.flatMap(w => w.entries.filter(e => e.exerciseId === progressEx).flatMap(e => doneSets(e).map(s => s.w || 0))));
    exPart = `
    <div class="card">
      <select onchange="progressEx=this.value;render()">${used.map(id => `<option value="${id}" ${id === progressEx ? "selected" : ""}>${esc(exName(id))}</option>`).join("")}</select>
      <div class="stats" style="margin:12px 0 4px">
        <div class="stat"><div class="v">${fmtNum(best)}</div><div class="l">Bestes 1RM (geschätzt)</div></div>
        <div class="stat"><div class="v">${fmtNum(maxW)}</div><div class="l">Max. Gewicht kg</div></div>
        <div class="stat"><div class="v">${pts.length}</div><div class="l">Einheiten</div></div>
      </div>
      <div class="muted" style="margin:6px 0">Geschätztes 1RM pro Training (kg)</div>
      <canvas id="chartEx"></canvas>
    </div>`;
  }

  return `
  ${exPart}
  <div class="card">
    <div class="muted" style="margin-bottom:6px">Volumen pro Woche (kg, letzte 12 Wochen)</div>
    <canvas id="chartVol"></canvas>
  </div>
  <div class="card">
    <h3>Körpergewicht</h3>
    <div class="row" style="margin:10px 0">
      <input id="bwIn" inputmode="decimal" placeholder="kg heute">
      <button class="btn primary" onclick="addBw()">Eintragen</button>
    </div>
    ${bw.length ? `<canvas id="chartBw"></canvas><div class="muted" style="margin-top:6px">Aktuell: ${fmtNum(bw[bw.length - 1].kg)} kg${bw.length > 1 ? ` · Änderung: ${(bw[bw.length - 1].kg - bw[0].kg >= 0 ? "+" : "") + fmtNum(bw[bw.length - 1].kg - bw[0].kg)} kg` : ""}</div>` : `<div class="muted">Noch keine Einträge.</div>`}
  </div>`;
}
function exercisePoints(id) {
  return S.workouts.map(w => {
    const e = w.entries.find(x => x.exerciseId === id);
    if (!e || !doneSets(e).length) return null;
    return { x: w.start, y: Math.max(...doneSets(e).map(s => e1rm(s.w || 0, s.r))) };
  }).filter(Boolean);
}
function addBw() {
  const kg = parseFloat($("#bwIn").value.replace(",", "."));
  if (!(kg > 0)) return toast("Ungültiges Gewicht");
  const today = dayKey(Date.now());
  S.bodyweight = S.bodyweight.filter(b => dayKey(b.date) !== today);
  S.bodyweight.push({ date: Date.now(), kg }); save(); render();
}

function drawCharts() {
  if (progressEx) lineChart($("#chartEx"), exercisePoints(progressEx));
  const wk = startOfWeek(Date.now()), bars = [];
  for (let i = 11; i >= 0; i--) {
    const s = wk - i * 7 * 864e5;
    bars.push({ label: new Date(s).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" }), y: S.workouts.filter(w => w.start >= s && w.start < s + 7 * 864e5).reduce((a, w) => a + volume(w), 0) });
  }
  barChart($("#chartVol"), bars);
  const bw = [...S.bodyweight].sort((a, b) => a.date - b.date).map(b => ({ x: b.date, y: b.kg }));
  if (bw.length && $("#chartBw")) lineChart($("#chartBw"), bw);
}
function setupCanvas(c) {
  const dpr = window.devicePixelRatio || 1, r = c.getBoundingClientRect();
  c.width = r.width * dpr; c.height = r.height * dpr;
  const ctx = c.getContext("2d"); ctx.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  return { ctx, W: r.width, H: r.height, accent: cs.getPropertyValue("--accent").trim(), muted: cs.getPropertyValue("--muted").trim(), line: cs.getPropertyValue("--line").trim() };
}
function axes(g, lo, hi, padL) {
  const { ctx, W, H, muted, line } = g;
  ctx.font = "11px system-ui"; ctx.fillStyle = muted; ctx.strokeStyle = line; ctx.lineWidth = 1;
  for (let k = 0; k <= 3; k++) {
    const v = lo + (hi - lo) * k / 3, y = H - 20 - (H - 30) * k / 3;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W, y); ctx.stroke();
    ctx.fillText(fmtNum(v), 0, y + 4);
  }
}
function lineChart(c, pts) {
  if (!c) return;
  const g = setupCanvas(c), { ctx, W, H, accent, muted } = g, padL = 38;
  if (!pts.length) return;
  let lo = Math.min(...pts.map(p => p.y)), hi = Math.max(...pts.map(p => p.y));
  if (hi === lo) { hi += 1; lo -= 1; }
  const pad = (hi - lo) * 0.1; lo -= pad; hi += pad;
  axes(g, lo, hi, padL);
  const x0 = pts[0].x, x1 = pts[pts.length - 1].x || x0 + 1;
  const X = p => pts.length === 1 ? (padL + W) / 2 : padL + 6 + (W - padL - 12) * (p.x - x0) / (x1 - x0);
  const Y = p => H - 20 - (H - 30) * (p.y - lo) / (hi - lo);
  ctx.strokeStyle = accent; ctx.lineWidth = 2; ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(X(p), Y(p)) : ctx.moveTo(X(p), Y(p))); ctx.stroke();
  ctx.fillStyle = accent; pts.forEach(p => { ctx.beginPath(); ctx.arc(X(p), Y(p), 3, 0, 7); ctx.fill(); });
  ctx.fillStyle = muted; ctx.font = "11px system-ui";
  const d = t => new Date(t).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" });
  ctx.fillText(d(x0), padL, H - 4);
  if (pts.length > 1) { const s = d(x1); ctx.fillText(s, W - ctx.measureText(s).width, H - 4); }
}
function barChart(c, bars) {
  if (!c) return;
  const g = setupCanvas(c), { ctx, W, H, accent, muted } = g, padL = 44;
  const hi = Math.max(1, ...bars.map(b => b.y));
  axes(g, 0, hi, padL);
  const bw = (W - padL) / bars.length;
  bars.forEach((b, i) => {
    const h = (H - 30) * b.y / hi;
    ctx.fillStyle = accent; ctx.fillRect(padL + i * bw + bw * 0.18, H - 20 - h, bw * 0.64, h);
    if (i % 3 === 2 || i === bars.length - 1) { ctx.fillStyle = muted; ctx.fillText(b.label, Math.min(padL + i * bw, W - ctx.measureText(b.label).width), H - 4); }
  });
}

    ${id ? `<p class="muted">Umbenennen ändert den Namen auch im Verlauf und in deinen Plänen.</p>` : ""}
    <div class="row" style="margin-top:12px">
      ${id ? `<button class="btn block danger" onclick="deleteEx('${id}')">Löschen</button>` : ""}
      <button class="btn block primary" onclick="saveExercise(${id ? `'${id}'` : "null"})">Speichern</button>
    </div>`);
  $("#exEditName").focus();
}
function saveExercise(id) {
  const name = $("#exEditName").value.trim(), group = $("#exEditGroup").value;
  if (!name) return toast("Bitte einen Namen eingeben");
  if (S.exercises.some(e => e.id !== id && e.name.toLowerCase() === name.toLowerCase())) return toast(`„${name}“ gibt es schon`);
  const ex = S.exercises.find(e => e.id === id);
  if (ex) Object.assign(ex, { name, group }); else S.exercises.push({ id: uid(), name, group });
  save(); closeModal(); render(); toast(ex ? "Übung gespeichert" : `„${name}“ angelegt`);
}
async function deleteEx(id) {
  const used = S.workouts.some(w => w.entries.some(e => e.exerciseId === id));
  if (!(await ask(used ? `${exName(id)} kommt im Verlauf vor und erscheint dort dann als „Gelöschte Übung“. Trotzdem löschen?` : `${exName(id)} löschen?`))) return;
  S.exercises = S.exercises.filter(e => e.id !== id);
  S.templates.forEach(t => t.exerciseIds = t.exerciseIds.filter(x => x !== id));
  save(); closeModal(); render();
}
async function download(name, text, type) {
  if (window.claude && window.claude.use) {
    const dl = await claude.use("downloads");
    if (!dl) return toast("Export ist in dieser Ansicht nicht verfügbar.");
    try { await dl.save({ filename: name, data: new Blob([text], { type }) }); } catch (e) { if (e && e.code !== "declined" && e.code !== "cancelled") toast("Export fehlgeschlagen."); }
    return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function exportData() { download(`gymlog-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(S, null, 2), "application/json"); }
function exportCsv() {
  const rows = [["Datum", "Training", "Übung", "Satz", "Gewicht (kg)", "Wiederholungen"]];
  S.workouts.forEach(w => w.entries.forEach(e => doneSets(e).forEach((s, i) => rows.push([new Date(w.start).toISOString().slice(0, 10), w.name, exName(e.exerciseId), i + 1, s.w || 0, s.r]))));
  download("gymlog.csv", rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(";")).join("\n"), "text/csv");
}
function importData(file) {
  if (!file) return;
  file.text().then(async t => {
    const d = JSON.parse(t);
    if (!Array.isArray(d.workouts) || !Array.isArray(d.exercises)) throw new Error();
    $("#importFile").value = "";
    if (!(await ask(`Backup mit ${d.workouts.length} Trainings laden? Deine aktuellen Daten werden ersetzt.`, "Ersetzen"))) return;
    const next = Object.assign(freshState(), d);
    next.settings = Object.assign(freshState().settings, d.settings);
    await replaceAll(next); applyTheme(); toast("Backup importiert"); render();
  }).catch(() => toast("Die Datei ist kein GymLog-Backup."));
}
async function resetAll() { if (await ask("Alle Trainings, Pläne und Körpergewichte löschen? Das lässt sich nicht rückgängig machen.", "Alles löschen")) { await replaceAll(freshState()); stopTimer(); go("home"); } }

// ---------- Pausentimer ----------
let timerEnd = 0, timerInt = null;
function startTimer(sec) {
  if (!sec) return;
  timerEnd = Date.now() + sec * 1000; $("#timer").classList.add("show"); document.body.classList.add("timing");
  clearInterval(timerInt); timerInt = setInterval(tick, 250); tick();
}
function tick() {
  const left = Math.max(0, Math.ceil((timerEnd - Date.now()) / 1000));
  $("#timerT").textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
  if (left === 0) { stopTimer(); beep(); toast("Pause vorbei – nächster Satz! 💪"); }
}
function stopTimer() { clearInterval(timerInt); $("#timer").classList.remove("show"); document.body.classList.remove("timing"); }
function beep() {
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch {}
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)(), o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination); o.frequency.value = 880; g.gain.value = 0.15;
    o.start(); o.stop(ac.currentTime + 0.4);
  } catch {}
}
$("#timerStop").onclick = stopTimer;
document.querySelectorAll("[data-tadd]").forEach(b => b.onclick = () => { timerEnd += +b.dataset.tadd * 1000; tick(); });

// ---------- Modal, Rückfrage & Toast ----------
function ask(msg, okLabel = "Löschen") {
  return new Promise(res => {
    $("#ask").innerHTML = `<p style="margin:0 0 14px">${esc(msg)}</p><div class="row"><button class="btn block" id="askNo">Abbrechen</button><button class="btn block danger-fill" id="askYes">${esc(okLabel)}</button></div>`;
    $("#askBg").classList.add("show");
    const done = v => { $("#askBg").classList.remove("show"); res(v); };
    $("#askNo").onclick = () => done(false); $("#askYes").onclick = () => done(true);
    $("#askYes").focus();
  });
}
function openModal(html) { $("#modal").innerHTML = html; $("#modalBg").classList.add("show"); }
function closeModal() { $("#modalBg").classList.remove("show"); }
$("#modalBg").addEventListener("click", e => { if (e.target.id === "modalBg") closeModal(); });
function toast(msg) {
  const t = document.createElement("div");
  t.textContent = msg;
  t.style.cssText = "position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;font-size:14px;max-width:calc(100% - 32px);text-align:center";
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}

// Dauer im laufenden Training aktualisieren
setInterval(() => { const d = $("#dur"); if (d && S.active) d.textContent = fmtDur(Date.now() - S.active.start); }, 30000);

try { if (!window.claude && "serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {}); } catch {}
applyTheme();
render();
initCloud();
</script>
